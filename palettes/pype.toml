# pype.dev — near-black navy canvas, cyan links, mint accent.
# Dracula accents for code/admonitions, ported from the python-era site.

[palette]
name = "Pype"
variant = "dark"
author = "Nic Payne"
license = "MIT"
description = "pype.dev terminal palette"

[palette.colors]
bg           = "#04070d"
bg-alt       = "#070c16"
surface      = "#090f1b"
surface-alt  = "#0d1526"
line         = "#1d2a3d"
text         = "#f8fafc"
muted        = "#a1acc4"
dim          = "#5b6b8c"
cyan         = "#3dd5ff"
mint         = "#62ffa9"
teal         = "#64ffda"
purple       = "#bd93f9"
pink         = "#ff79c6"
red          = "#ff5555"
orange       = "#ffb86c"
yellow       = "#f1fa8c"
green        = "#50fa7b"
ice          = "#8be9fd"

[palette.semantic]
text-primary   = "text"
text-secondary = "text"
text-muted     = "muted"
bg-primary     = "bg"
bg-secondary   = "bg-alt"
bg-surface     = "surface"
bg-elevated    = "surface-alt"
accent         = "mint"
accent-hover   = "cyan"
link           = "cyan"
link-hover     = "mint"
link-visited   = "purple"
success        = "green"
warning        = "orange"
error          = "red"
info           = "ice"
border         = "line"
border-focus   = "mint"

[palette.components]
code-bg       = "surface"
code-text     = "text"
code-comment  = "dim"
code-keyword  = "pink"
code-string   = "yellow"
code-number   = "purple"
code-function = "green"
code-type     = "ice"
code-operator = "pink"

# dark surface + accent border (left bar/glow comes from pype.css)
admonition-note-bg        = "surface"
admonition-note-border    = "yellow"
admonition-abstract-bg    = "surface"
admonition-abstract-border = "ice"
admonition-info-bg        = "surface"
admonition-info-border    = "cyan"
admonition-tip-bg         = "surface"
admonition-tip-border     = "teal"
admonition-success-bg     = "surface"
admonition-success-border = "green"
admonition-warn-bg        = "surface"
admonition-warn-border    = "orange"
admonition-error-bg       = "surface"
admonition-error-border   = "red"
admonition-quote-bg       = "surface"
admonition-quote-border   = "purple"

button-primary-bg     = "mint"
button-primary-text   = "bg"
button-secondary-bg   = "surface-alt"
button-secondary-text = "text"

nav-bg     = "bg-alt"
nav-text   = "text"
nav-active = "mint"

card-bg     = "surface"
card-border = "line"
card-shadow = "bg-alt"
