<header class="post-header">
    <h1 id="title" class="post-header__title">{{ post.title }}</h1>
    <div class="post-header__meta">
        <time datetime="{{ post.date.isoformat() if post.date else '' }}">
            {{ post.date.strftime('%B %d, %Y') if post.date else 'N/A' }}
        </time>
    </div>
    {% if post.tags and post.tags|length > 0 %}
    <div class="post-header__tags">
        {% for tag in post.tags %}
            <a href="{{ markata.config.get('url', '') }}/tags/{{ tag }}/" class="post-header__tag">
                #{{ tag }}
            </a>
        {% endfor %}
    </div>
    {% endif %}
</header>
